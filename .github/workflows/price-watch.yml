name: Price Watch — أسعار السوق

on:
  schedule:
    - cron: "0 6 * * *"          # كل يوم الساعة 9 الصبح بتوقيت القاهرة
  workflow_dispatch:
    inputs:
      query:
        description: "اسم المنتج (سيبه فاضي عشان يدور على قايمة المتابعة كلها)"
        required: false
        default: ""
  push:
    branches: ["claude/**"]
    paths: ["price-watch/**", ".github/workflows/price-watch.yml"]

permissions:
  contents: write

concurrency:
  group: price-watch
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: price-watch/requirements.txt

      - name: Install
        run: |
          pip install -r price-watch/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq xvfb >/dev/null

      - name: Search
        env:
          QUERY: ${{ github.event.inputs.query }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRICES_PAGE_URL: https://karimyahia25.github.io/offers/prices/
          BROWSER_CHANNEL: chrome
          HEADED: "1"
          SHOW_CARDS: "1"
        run: |
          if [ -n "$QUERY" ]; then
            xvfb-run -a python price-watch/search.py --query "$QUERY"
          else
            xvfb-run -a python price-watch/search.py
          fi

      - name: Screenshots of failed sites
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: price-watch/debug/
          if-no-files-found: ignore

      - name: Save results
        if: always()
        run: |
          git config user.name "price-watch-bot"
          git config user.email "price-watch-bot@users.noreply.github.com"
          git add prices/data.json price-watch/history.csv 2>/dev/null || true
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update market prices"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done

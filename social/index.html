<script>

*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:'IBM Plex Sans Arabic',system-ui,Tahoma,sans-serif;color:var(--ink);

  display:flex;flex-direction:column;align-items:center;padding:40px 16px 28px;text-align:center}
.logo{background:#fff;border-radius:22px;padding:10px 16px;box-shadow:0 10px 26px rgba(7,58,75,.14)}
.logo img{height:96px;display:block}
h1{font-family:Alexandria;font-weight:900;font-size:clamp(22px,7vw,32px);line-height:1.3;color:var(--navy);margin-top:26px}
h1 span{background:linear-gradient(transparent 60%,var(--yel) 60% 92%,transparent 92%);padding:0 4px;white-space:nowrap}
.lead{font-size:17px;color:var(--ink2);margin-top:10px;max-width:340px;line-height:1.6}
.links{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;margin-top:30px}
.links a{display:flex;align-items:center;gap:14px;min-height:68px;padding:12px 18px;border-radius:20px;color:#fff;text-decoration:none;
  font-weight:700;font-size:19px;box-shadow:0 12px 26px rgba(7,58,75,.18);transition:transform .15s}
.links a:active{transform:scale(.98)}
.links a i{flex:none;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.links a svg{width:26px;height:26px;fill:#fff}
.links a b{flex:1;text-align:right}
.links a small{font-weight:400;font-size:14px;opacity:.9;direction:ltr}
.fb{background:#1877f2}
.ig{background:linear-gradient(45deg,#f9a825,#e1306c 45%,#833ab4)}
.tt{background:#111}
footer{margin-top:auto;padding-top:34px;font-size:14px;color:var(--ink2);line-height:1.7}
footer a{color:var(--tq);font-weight:700;text-decoration:none}
@media (prefers-reduced-motion:reduce){.links a{transition:none}}

<script>
document.querySelectorAll(".links a").forEach(function(a){
  a.addEventListener("click", function(e){
    // بنستنى Analytics يستلم الدوسة (لحد ثانية) قبل ما نفتح التطبيق، وإلا الحدث بيضيع
    e.preventDefault();
    var gone = false, go = function(){ if(!gone){ gone = true; location.href = a.href; } };
    gtag('event', 'social_click', {where: a.dataset.w, from: 'social_page', ad_src: src || '(none)', transport_type: 'beacon', event_callback: function(){ setTimeout(go, 400); }});
    setTimeout(go, 1200);
  });
});

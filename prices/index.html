<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>أسعار السوق | صيدلية د. أنس نحيلة</title>
<style>
:root{--bg:#f4f7f8;--card:#fff;--ink:#12263a;--mut:#5b6b7a;--red:#d62828;--teal:#0e8a8f;--green:#1b8a3a;--line:#dde5ea;--soft:#eef6f6}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a24;--card:#17252f;--ink:#eef3f6;--mut:#9fb0bd;--line:#26384a;--soft:#1c303b;--green:#4cc771}}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;background:var(--teal);color:#fff;padding:12px 16px;z-index:5}
header h1{margin:0 0 4px;font-size:18px}
header .sub{font-size:13px;opacity:.85;margin-bottom:8px}
#q{width:100%;font:inherit;font-size:18px;padding:10px 14px;border:0;border-radius:12px;color:#12263a}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.acts a{flex:1 1 140px;text-align:center;text-decoration:none;font-size:14px;border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.18);color:#fff}
main{padding:12px 16px 40px;max-width:820px;margin:auto}
h2{font-size:15px;color:var(--mut);margin:18px 0 8px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.prod>h3{margin:0;font-size:19px}
.prod>.q{color:var(--mut);font-size:13px;direction:ltr;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.tile{background:var(--soft);border-radius:12px;padding:10px 12px}
.tile small{display:block;color:var(--mut);font-size:12px}
.tile b{font-size:22px}
.tile span{font-size:13px;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.row img{width:48px;height:48px;object-fit:contain;border-radius:8px;background:#fff;flex:none}
.nm{flex:1;min-width:0}
.nm .site{display:inline-block;font-size:12px;font-weight:700;color:var(--teal);margin-bottom:2px}
.nm .t{font-size:14px;direction:ltr;text-align:right;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nm .u{font-size:12px;color:var(--mut)}
.pr{text-align:center;min-width:86px}
.now{font-size:20px;font-weight:800;line-height:1.1}
.was{color:var(--mut);text-decoration:line-through;font-size:13px}
.off{display:inline-block;background:var(--red);color:#fff;border-radius:6px;font-size:12px;padding:1px 6px;margin-top:2px}
.best .now{color:var(--green)}
.go{flex:none;text-decoration:none;border:1px solid var(--teal);color:var(--teal);border-radius:10px;padding:8px 10px;font-size:13px}
.err{font-size:12px;color:var(--mut);margin-top:8px}
.more{font:inherit;width:100%;border:0;background:none;color:var(--teal);padding:8px;cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:40px 0}
</style>
</head>
<body>
<header>
  <h1>🔎 أحسن سعر في السوق</h1>
  <div class="sub" id="sub">بيحمّل…</div>
  <input id="q" type="search" placeholder="فلتر… مثال: جونسون" autocomplete="off">
  <div class="acts">
    <a href="https://github.com/karimyahia25/offers/actions/workflows/price-watch.yml" target="_blank" rel="noopener">➕ ابحث عن منتج جديد</a>
    <a href="https://github.com/karimyahia25/offers/edit/main/price-watch/watchlist.txt" target="_blank" rel="noopener">✏️ عدّل قايمة المتابعة</a>
  </div>
</header>
<main id="main"><div class="empty">بيحمّل…</div></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe = u => /^https?:\/\//i.test(u || "") ? u : "#";
const fmt = n => n == null ? "" : Number(n).toLocaleString("en-US", {maximumFractionDigits: 2});
let DATA = {watch: [], quick: []};

function tile(label, r, extra){
  if(!r) return "";
  return `<div class="tile"><small>${label}</small><b>${fmt(extra ? r.unit_price : r.price)}</b> <span>ج${extra ? " " + esc(r.unit_label) : ""}</span><br><span>${esc(r.site)}${!extra && r.discount ? " · خصم " + r.discount + "%" : ""}</span></div>`;
}

function row(r, best){
  return `<div class="row${r === best ? " best" : ""}">
    ${r.img ? `<img src="${esc(safe(r.img))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
    <div class="nm"><span class="site">${esc(r.site)}</span><div class="t">${esc(r.title)}</div>
      ${r.unit_price ? `<div class="u">${fmt(r.unit_price)} ج ${esc(r.unit_label)}</div>` : ""}</div>
    <div class="pr"><div class="now">${fmt(r.price)}</div>${r.old ? `<div class="was">${fmt(r.old)}</div>` : ""}${r.discount ? `<span class="off">-${r.discount}%</span>` : ""}</div>
    <a class="go" href="${esc(safe(r.url))}" target="_blank" rel="noopener">افتح</a>
  </div>`;
}

function product(p, i){
  const rs = p.results || [];
  const best = rs[0];
  const errs = Object.entries(p.errors || {});
  const shown = rs.slice(0, 8), rest = rs.slice(8);
  return `<section class="prod">
    <h3>${esc(p.name)}</h3><div class="q">${esc(p.query)} · ${esc(p.checked || "")}</div>
    ${rs.length ? `<div class="tiles">${tile("🥇 أرخص سعر", p.best)}${tile("🔥 أكبر خصم", p.top_discount)}${tile("⚖️ أرخص بالحجم", p.best_unit, true)}</div>` : `<div class="empty">مفيش نتايج مطابقة</div>`}
    ${shown.map(r => row(r, best)).join("")}
    ${rest.length ? `<div id="more${i}" hidden>${rest.map(r => row(r, best)).join("")}</div><button class="more" data-i="${i}">عرض ${rest.length} كمان</button>` : ""}
    ${errs.length ? `<div class="err">ماوصلناش لنتايج من: ${errs.map(([k, v]) => `${esc(k)} (${esc(v)})`).join("، ")}</div>` : ""}
  </section>`;
}

function render(){
  const f = $("#q").value.trim().toLowerCase();
  const pick = l => (l || []).filter(p => !f || (p.name + " " + p.query).toLowerCase().includes(f));
  const quick = pick(DATA.quick), watch = pick(DATA.watch);
  let html = "", i = 0;
  if(quick.length) html += `<h2>⚡ بحث سريع</h2>` + quick.map(p => product(p, i++)).join("");
  if(watch.length) html += `<h2>📋 قايمة المتابعة</h2>` + watch.map(p => product(p, i++)).join("");
  $("#main").innerHTML = html || `<div class="empty">مفيش نتايج لسه</div>`;
}

document.addEventListener("click", e => {
  const b = e.target.closest(".more");
  if(!b) return;
  $("#more" + b.dataset.i).hidden = false;
  b.remove();
});
$("#q").addEventListener("input", render);

fetch("data.json?" + Date.now()).then(r => r.ok ? r.json() : Promise.reject())
  .then(d => {
    DATA = d;
    $("#sub").textContent = `آخر تحديث: ${d.updated || "—"} · المواقع: ${(d.sites || []).join("، ")}`;
    render();
  })
  .catch(() => { $("#sub").textContent = ""; $("#main").innerHTML = `<div class="empty">لسه مفيش نتايج — شغّل البحث من زرار "ابحث عن منتج جديد"</div>`; });
</script>
</body>
</html>

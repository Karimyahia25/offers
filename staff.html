<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>أسعار الستاف | صيدلية د. أنس نحيلة</title>
<style>
:root{--bg:#f4f7f8;--card:#fff;--ink:#12263a;--mut:#5b6b7a;--red:#d62828;--teal:#0e8a8f;--line:#dde5ea}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a24;--card:#17252f;--ink:#eef3f6;--mut:#9fb0bd;--line:#26384a}}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--teal);color:#fff;padding:12px 16px;z-index:5}
header h1{margin:0 0 8px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{flex:none;font:inherit;border:0;border-radius:20px;padding:8px 16px;background:rgba(255,255,255,.2);color:#fff;min-height:44px}
.chips button.on{background:#fff;color:var(--teal);font-weight:700}
.chips:empty{display:none}
.chips.fam button{font-size:17px;font-weight:700;min-height:46px;padding:6px 22px;background:rgba(0,0,0,.18)}
.chips.fam button.on{background:var(--yel,#ffd23f);color:#12263a}
.lbl{font-size:13px;opacity:.85;margin-top:8px}
.chips{margin-top:4px}
.chips button{font-size:15px;padding:6px 14px;min-height:40px}
.desc{display:block;font-size:14px;color:var(--mut);margin-top:2px}
.cpbox{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.cpbox.on{display:flex}
.cpbox div{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:420px}
.cpbox textarea{width:100%;font:inherit;font-size:16px;height:90px;border:1px solid var(--line);border-radius:10px;padding:8px}
.cpbox button{font:inherit;margin-top:10px;width:100%;min-height:44px;border:0;border-radius:10px;background:var(--teal);color:#fff}
main{padding:12px 16px;max-width:760px;margin:auto}
.info{color:var(--mut);font-size:14px;margin:4px 0 10px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:17px;direction:ltr;text-align:right;word-break:break-word}
.nm small{color:var(--mut)}
.pr{text-align:center;min-width:92px}
.now{font-size:26px;font-weight:800;color:var(--red);line-height:1}
.now small{font-size:13px;font-weight:600}
.was{color:var(--mut);text-decoration:line-through;font-size:14px}
.cp{font:inherit;border:1px solid var(--teal);background:none;color:var(--teal);border-radius:10px;padding:0 12px;min-height:44px}
.cp.ok{background:var(--teal);color:#fff}
.empty{text-align:center;color:var(--mut);padding:40px 0}
</style>
</head>
<body>
<header>
  <h1>أسعار الخصم — للستاف بس</h1>
  <div class="chips fam" id="fams"></div>
  <div class="chips" id="chips"></div>
  <div class="lbl" id="sizeLbl">المقاس</div><div class="chips" id="sizes"></div>
</header>
<div class="cpbox" id="cpbox"><div><b>النسخ التلقائي مش شغال هنا — النص متحدد، اضغط عليه مطولاً واختار نسخ:</b><textarea id="cptxt" readonly></textarea><button id="cpclose">تمام</button></div></div>
<main>
  <div class="info" id="info"></div>
  <div id="list"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clean = s => String(s).toLowerCase().replace(/[()+\-_,]/g, " ").replace(/\s+/g, " ").trim();
const ar2en = {"بامبرز":"pampers","بامبيرز":"pampers","مولفيكس":"molfix","مولفكس":"molfix","بيبي جوي":"baby joy"};

function parseCSV(t){
  const rows = []; let r = [], f = "", q = false;
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(q){ if(c === '"'){ if(t[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ","){ r.push(f); f = ""; }
    else if(c === "\n"){ r.push(f); rows.push(r); r = []; f = ""; }
    else if(c !== "\r") f += c;
  }
  if(f || r.length){ r.push(f); rows.push(r); }
  const head = rows.shift().map(h => h.replace(/^﻿/, "").trim());
  return rows.filter(r => r.some(x => x.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])));
}

let ALL = [], fam = "milk", brand = "", typ = "", size = "";
const BRANDS = [["pampers","بامبرز"],["molfix","مولفيكس"],["baby joy","بيبي جوي"]];
const TYPES = ["عادي","شورت","بريميوم","بريميوم شورت","نيوبورن","مناديل"];
/* المقاس من الاسم زي الموقع: "(4)" أو رقم لوحده 1–7 */
function sizeOf(n){
  if(/wip|مناديل/i.test(n)) return "";
  const m = n.match(/\(\s*([1-7])\s*\)/) || n.match(/(?:^|\D)([1-7])(?!\d)/);
  return m ? m[1] : "";
}
/* النوع من الوصف: "مولفيكس شورت · مقاس 4 · 58 قطعة" */
function typeOf(p){
  const d = (p.desc.split("·")[0] || "");
  if(/مناديل/.test(d)) return "مناديل";
  if(/نيوبورن/.test(d)) return "نيوبورن";
  if(/بريميوم/.test(d) && /شورت/.test(d)) return "بريميوم شورت";
  if(/بريميوم/.test(d)) return "بريميوم";
  if(/شورت/.test(d)) return "شورت";
  return "عادي";
}
const brandOf = p => (BRANDS.find(([k]) => clean(p.name).startsWith(k)) || [""])[0];
/* الألبان (24/10): النوع + المرحلة */
const M_BRANDS = [["bebelac","بيبيلاك"],["hero","هيرو"],["sense","هيرو سيسنس"],["defense","هيرو نيوتراديفينس"],["s26","S-26 جولد"]];
function milkBrandOf(n){
  if(/nutrasense/i.test(n)) return "sense";
  if(/nutradefense/i.test(n)) return "defense";
  if(/hero/i.test(n)) return "hero";
  if(/s-?26/i.test(n)) return "s26";
  if(/bebelac/i.test(n)) return "bebelac";
  return "";
}
const FAMS = [["milk","🍼 لبن"],["dia","👶 حفاضات"]];
const chips = (el, items, cur) => { el.innerHTML = items.length > 1 ? items.map(([v, l]) => `<button class="${v===cur?"on":""}" data-v="${esc(v)}">${esc(l)}</button>`).join("") : ""; };

function render(){
  const fs = FAMS.filter(([k]) => ALL.some(p => p.fam===k));
  if(!fs.some(([k]) => k===fam)) fam = (fs[0]||[""])[0];
  chips($("#fams"), fs, fam);
  const FAM = ALL.filter(p => p.fam===fam), BR = fam==="milk" ? M_BRANDS : BRANDS;
  $("#sizeLbl").textContent = fam==="milk" ? "المرحلة" : "المقاس";
  const bs = BR.filter(([k]) => FAM.some(p => p.brand===k));
  if(bs.length < 2) brand = "";
  chips($("#chips"), bs.length > 1 ? [["","الكل"], ...bs.map(([k,a]) => [k,a])] : [], brand);
  const pool1 = FAM.filter(p => !brand || p.brand===brand);
  const pool2 = pool1;   /* النوع اتشال بطلبه 18/10 — المقاسات بس */
  const ss = [...new Set(pool2.flatMap(p => p.sizes))].sort();
  if(size && !ss.includes(size)) size = "";
  const w = fam==="milk" ? "مرحلة" : "مقاس";
  chips($("#sizes"), [["","كل "+(fam==="milk"?"المراحل":"المقاسات")], ...ss.map(x => [x,w+" "+x])], size);
  const list = pool2.filter(p => !size || p.sizes.includes(size));
  $("#info").textContent = list.length + " صنف";
  $("#list").innerHTML = list.length ? list.map(p => {
    const pct = p.was > p.now ? Math.round((1 - p.now / p.was) * 100) : 0;
    return `<div class="row"><div class="nm"><b>${esc(p.name)}</b>${p.desc ? `<span class="desc">${esc(p.desc)}</span>` : ""}${p.code ? `<small>كود ${esc(p.code)}</small>` : ""}</div>
      <div class="pr"><div class="now">${p.now}<small> ج</small></div>${pct ? `<div class="was">${p.was}</div>` : ""}</div>
      <button class="cp" data-i="${p.i}">نسخ</button></div>`;
  }).join("") : `<div class="empty">مفيش أصناف بالاختيار ده</div>`;
}
const pick = (id, set) => $(id).onclick = e => { const b = e.target.closest("button"); if(!b) return; set(b.dataset.v); render(); };
pick("#fams", v => { fam = v; brand = ""; size = ""; });
pick("#chips", v => { brand = v; });
pick("#sizes", v => { size = v; });

/* النسخ: clipboard API، ولو اتقفل (متصفح الواتساب/الفيسبوك) execCommand، ولو فشل نافذة فيها النص متحدد */
function copyText(txt){
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = txt; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
    let ok = false; try{ ok = document.execCommand("copy"); }catch(e){}
    ta.remove(); return ok;
  };
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(txt).then(() => true, () => fallback());
  return Promise.resolve(fallback());
}
$("#list").onclick = e => {
  const b = e.target.closest(".cp"); if(!b) return;
  const p = ALL.find(x => String(x.i) === b.dataset.i); if(!p) return;
  const txt = `${p.desc || p.name}\nالسعر بعد الخصم: ${p.now} جنيه${p.was > p.now ? ` بدل ${p.was}` : ""}`;
  copyText(txt).then(ok => {
    if(!ok){ $("#cptxt").value = txt; $("#cpbox").classList.add("on"); $("#cptxt").focus(); $("#cptxt").select(); return; }
    b.textContent = "تم ✓"; b.classList.add("ok");
    setTimeout(() => { b.textContent = "نسخ"; b.classList.remove("ok"); }, 1200);
  });
};
$("#cpclose").onclick = () => $("#cpbox").classList.remove("on");

fetch("products.csv?t=" + Date.now()).then(r => r.text()).then(t => {
  ALL = parseCSV(t).map((r, i) => ({
    i, name: r["الاسم"], code: r["الكود"], desc: r["الوصف"] || "", cat: r["الفئة"] || "", hidden: /^(لا|no|0|مخفي)$/i.test((r["ظاهر"]||"").trim()), was: Number(r["السعر قبل"]), now: Number(r["السعر بعد"]),
    hay: clean(r["الاسم"] + " " + r["الكود"])
  })).filter(p => p.name && !isNaN(p.now) && !p.hidden);
  ALL.forEach(p => {
    p.fam = /لبن|ألبان|البان|formula/i.test(p.cat) ? "milk" : "dia";
    p.brand = p.fam==="milk" ? milkBrandOf(p.name) : brandOf(p);
    p.type = typeOf(p); p.size = sizeOf(p.name);
    /* لبن بكارت واحد لكل المراحل "(1-2-3)" (28/10) */
    const ms = p.fam==="milk" && p.name.match(/\(\s*([1-4](?:\s*-\s*[1-4])+)\s*\)/);
    p.sizes = ms ? ms[1].split("-").map(x => x.trim()) : p.size ? [p.size] : [];
  });   /* اللي "ظاهر = لا" مش معروض للستاف كمان */
  /* (31/10، طلبه) الموقع رجع كارت لكل مرحلة، والستاف يفضل كارت واحد لكل نوع لبن بكل مراحله (نفس السعر) */
  const mg = new Map();
  ALL = ALL.filter(p => {
    if(p.fam !== "milk") return true;
    const k = p.name.replace(/\(\s*[1-4](?:\s*-\s*[1-4])*\s*\)/, "()") + "|" + p.now + "|" + p.was;
    const g = mg.get(k);
    if(!g){ mg.set(k, p); return true; }
    g.sizes = [...new Set([...g.sizes, ...p.sizes])].sort();
    return false;
  });
  mg.forEach(g => {
    if(g.sizes.length < 2) return;
    g.name = g.name.replace(/\(\s*[1-4]\s*\)/, "(" + g.sizes.join("-") + ")");
    g.code = g.code.replace(/-\d$/, "");
    g.desc = g.desc.replace(/مرحلة \d · /, "مرحلة " + g.sizes.join(" و ") + " · ").replace(/ · من [^·]*$/, " · نفس السعر لكل المراحل");
  });
  render();
}).catch(() => { $("#list").innerHTML = '<div class="empty">تعذر تحميل القائمة</div>'; });
</script>
</body>
</html>

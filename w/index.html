<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>صيدلية د. أنس نحيلة</title>
<!--
  صفحة تحويل أزرار رسائل الواتساب الرسمي (الرقم +20 10 50822954) ← واتساب الصيدلية الأساسي 012.
  اللينك: /w/?k=o-1234 (قديم: كود العميل) أو /w/?k=o-a7k2m9x4qp (24/11: رقم عشوائي ← الأصناف من الـ Worker /tk)  (o = جهزوا طلبي، q = اسأل الصيدلي)
  بتسجل حدث GA «wa_reminder_click» وبعدين تفتح الواتساب والرسالة جاهزة.
-->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SK4WXJPFK9"></script>
<!-- (23/11) Meta Pixel — نفس بيكسل الموقع: «Contact» = داس زرار في تذكير الواتساب (من غير اسم ولا أصناف) -->
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '1590130022330090');
fbq('trackCustom', 'WaReminderClick', { kind: /^[?&]?k=o/i.test(location.search.replace(/^\?/, '')) ? 'order' : 'question' });
fbq('track', 'Contact', { content_category: 'wa_reminder' });
</script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('set', 'user_properties', {ad_src: 'wa_reminder'});
  gtag('config', 'G-SK4WXJPFK9');

  (function () {
    var WA = "201288827555";
    var k = (new URLSearchParams(location.search).get("k") || "").trim();
    // k = o-<كود قديم أرقام> أو o-<رقم عشوائي 10 حروف> (24/11: القالبين الجداد — الأصناف متخزنة في الـ Worker بالرقم ده)
    var m = /^([oq])(?:-(\d{1,10}|[a-z0-9]{10}))?$/i.exec(k);
    var type = m ? m[1].toLowerCase() : "q";
    var tok = m && m[2] && /[a-z]/i.test(m[2]) ? m[2].toLowerCase() : "";
    // (23/11، طلبه) الفرع بيسجّل برقم التليفون مش بالكود — والرسالة بتيجي من نفس الرقم اللي اتبعتله التذكير (المتسجل عندنا).
    // الرقم والأصناف ممنوع يتحطوا في اللينك (بيروحوا لـ GA وسجلات الاستضافة) — الأصناف بتتجاب من الـ Worker بالرقم العشوائي.
    var tag = "\n🔔 من تذكير الواتساب";
    function build(items) {
      var list = items && items.length ? ":\n" + items.map(function (x) { return "- " + x; }).join("\n") : "";
      return type === "o"
        ? "السلام عليكم، عايز أجدد طلبي الشهري" + list + tag
        : "السلام عليكم، عندي استفسار" + tag;
    }
    function setDest(t) {
      window.__dest = "https://wa.me/" + WA + "?text=" + encodeURIComponent(t);
      try { document.getElementById("go").href = window.__dest; } catch (e) {}
    }
    setDest(build([]));

    var gone = false, ga = false, items = !(tok && type === "o");
    function go() { if (!gone) { gone = true; location.replace(window.__dest); } }
    function maybe() { if (ga && items) go(); }
    if (!items) {
      var done = function (arr) { if (!items) { items = true; if (arr && arr.length) setDest(build(arr)); maybe(); } };
      try {
        fetch("https://anas-wa.anasnehila.workers.dev/tk/" + tok)
          .then(function (r) { return r.json(); })
          .then(function (j) { done((j && j.items || []).slice(0, 8).map(String)); })
          .catch(function () { done([]); });
      } catch (e) { done([]); }
      setTimeout(function () { done([]); }, 1800);   // الـ Worker اتأخر ← نكمّل من غير الأصناف
    }
    gtag("event", "wa_reminder_click", {
      ad_src: "wa_reminder",
      kind: type === "o" ? "order" : "question",
      event_callback: function(){ setTimeout(function () { ga = true; maybe(); }, 700); },   // نستنى البيكسل يلحق يتبعت
      event_timeout: 800
    });
    setTimeout(go, 2500);
  })();
</script>
</head>
<body style="font-family:system-ui,sans-serif;text-align:center;padding:48px 16px;background:#f5f6f1;color:#12324a">
  <p style="font-size:18px">بنفتحلك واتساب الصيدلية…</p>
  <p><a id="go" href="https://wa.me/201288827555" style="display:inline-block;padding:14px 22px;min-height:44px;border-radius:12px;background:#0b6e66;color:#fff;text-decoration:none;font-size:17px">لو مفتحش، دوس هنا</a></p>
  <script>try{document.getElementById("go").href = window.__dest;}catch(e){}</script>
</body>
</html>
